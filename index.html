<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Cadastro de Usuários</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    h1, h2 {
      margin-top: 0;
    }
    .subtitle {
      color: #666;
      margin-top: -8px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field-full {
      grid-column: 1 / -1;
    }
    label {
      font-weight: bold;
      font-size: 14px;
    }
    input {
      padding: 12px;
      border: 1px solid #cfd6dd;
      border-radius: 10px;
      font-size: 15px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    button {
      border: 0;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .btn-primary { background: #111827; color: white; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .search-box {
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }
    thead {
      background: #111827;
      color: white;
    }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    tbody tr:hover {
      background: #f9fafb;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .small {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead {
        display: none;
      }
      tr {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 10px;
      }
      td {
        border: none;
        padding: 8px 0;
      }
      td::before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Projeto portfólio • CRUD com localStorage</span>
      <h1>Sistema de Cadastro de Usuários</h1>
      <p class="subtitle">Projeto simples para portfólio: cadastrar, editar, excluir e pesquisar usuários.</p>

      <form id="userForm">
        <div class="grid">
          <div class="field">
            <label for="name">Nome</label>
            <input type="text" id="name" placeholder="Digite o nome" required />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite o e-mail" required />
          </div>

          <div class="field">
            <label for="age">Idade</label>
            <input type="number" id="age" placeholder="Digite a idade" min="1" required />
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary" id="saveBtn">Salvar usuário</button>
          <button type="button" class="btn-secondary" id="cancelBtn">Cancelar edição</button>
        </div>
        <p class="small">Os dados ficam salvos no navegador usando localStorage.</p>
      </form>
    </div>

    <div class="card">
      <h2>Usuários cadastrados</h2>

      <div class="search-box">
        <input type="text" id="search" placeholder="Pesquisar por nome ou e-mail" />
      </div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Idade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("userForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const ageInput = document.getElementById("age");
    const searchInput = document.getElementById("search");
    const tableBody = document.getElementById("userTableBody");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    let users = JSON.parse(localStorage.getItem("users")) || [];
    let editingId = null;

    function saveToLocalStorage() {
      localStorage.setItem("users", JSON.stringify(users));
    }

    function generateId() {
      return Date.now();
    }

    function clearForm() {
      form.reset();
      editingId = null;
      saveBtn.textContent = "Salvar usuário";
    }

    function renderUsers(filter = "") {
      tableBody.innerHTML = "";

      const filteredUsers = users.filter(user =>
        user.name.toLowerCase().includes(filter.toLowerCase()) ||
        user.email.toLowerCase().includes(filter.toLowerCase())
      );

      if (filteredUsers.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="4" class="empty">Nenhum usuário encontrado.</td>
          </tr>
        `;
        return;
      }

      filteredUsers.forEach(user => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td data-label="Nome">${user.name}</td>
          <td data-label="E-mail">${user.email}</td>
          <td data-label="Idade">${user.age}</td>
          <td data-label="Ações">
            <button class="btn-warning" onclick="editUser(${user.id})">Editar</button>
            <button class="btn-danger" onclick="deleteUser(${user.id})">Excluir</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const age = ageInput.value.trim();

      if (!name || !email || !age) {
        alert("Preencha todos os campos.");
        return;
      }

      const duplicatedEmail = users.some(user =>
        user.email.toLowerCase() === email.toLowerCase() && user.id !== editingId
      );

      if (duplicatedEmail) {
        alert("Já existe um usuário com esse e-mail.");
        return;
      }

      if (editingId) {
        users = users.map(user =>
          user.id === editingId ? { ...user, name, email, age } : user
        );
      } else {
        users.push({
          id: generateId(),
          name,
          email,
          age
        });
      }

      saveToLocalStorage();
      renderUsers(searchInput.value);
      clearForm();
    });

    cancelBtn.addEventListener("click", function() {
      clearForm();
    });

    searchInput.addEventListener("input", function() {
      renderUsers(searchInput.value);
    });

    function editUser(id) {
      const user = users.find(user => user.id === id);
      if (!user) return;

      nameInput.value = user.name;
      emailInput.value = user.email;
      ageInput.value = user.age;
      editingId = id;
      saveBtn.textContent = "Atualizar usuário";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteUser(id) {
      const confirmed = confirm("Deseja realmente excluir este usuário?");
      if (!confirmed) return;

      users = users.filter(user => user.id !== id);
      saveToLocalStorage();
      renderUsers(searchInput.value);

      if (editingId === id) {
        clearForm();
      }
    }

    renderUsers();
  </script>
</body>
</html>
